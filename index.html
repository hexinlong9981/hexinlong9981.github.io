<script>
  // 浏览器语言为日语 → ja，中文 → zh，其余 → en
  (function () {
    var l = (navigator.languages && navigator.languages[0] || navigator.language || "").toLowerCase();
    var to = l.indexOf("ja") === 0 ? "ja/" : l.indexOf("zh") === 0 ? "zh/" : "en/";
    if (location.search.indexOf("stay") < 0) location.replace(to);
  })();
</script>

  .pick { max-width: 480px; margin: 15vh auto; padding: 0 16px; text-align: center; }
  .pick a { display: block; margin: 10px 0; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
</style>
</head>
